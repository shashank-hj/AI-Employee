version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-employee-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_employee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-employee-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-employee-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-employee-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: ai-employee-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_employee
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CHANNEL_TIMEOUT_SECONDS=${CHANNEL_TIMEOUT_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-employee-net
    profiles:
      - gateway
      - all

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: ai-employee-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
      - path: .env-opencode
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_employee
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # LLM_PROVIDER intentionally comes from env_file (.env / .env-opencode)
      # so the opencode switch lives in .env-opencode, not .env.
      - RAG_URL=http://rag:8004
      - RAG_HEALTH_PATH=/health
      - SPEECH_URL=http://speech:8006
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_BASE_URL=${SARVAM_BASE_URL:-https://api.sarvam.ai}
      - SARVAM_MODEL=${SARVAM_MODEL:-sarvam-105b}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - USAGE_ENABLED=${USAGE_ENABLED:-true}
      - USAGE_PRICING=${USAGE_PRICING:-{}}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-smtp.gmail.com}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_IMAP_HOST=${EMAIL_IMAP_HOST:-imap.gmail.com}
      - EMAIL_IMAP_PORT=${EMAIL_IMAP_PORT:-993}
      - EMAIL_DISPLAY_NAME=${EMAIL_DISPLAY_NAME:-AI Employee}
      - CALENDAR_ENABLED=${CALENDAR_ENABLED:-false}
      - CALENDAR_PROVIDER=${CALENDAR_PROVIDER:-auto}
      - CALENDAR_TIMEZONE=${CALENDAR_TIMEZONE:-Asia/Kolkata}
      - CALENDAR_ICS_INVITES_ENABLED=${CALENDAR_ICS_INVITES_ENABLED:-true}
      - CALENDAR_DUPLICATE_WINDOW_MINUTES=${CALENDAR_DUPLICATE_WINDOW_MINUTES:-15}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-employee-net
    profiles:
      - orchestrator
      - all

  tool-registry:
    build:
      context: .
      dockerfile: services/tool-registry/Dockerfile
    container_name: ai-employee-tool-registry
    ports:
      - "${TOOL_REGISTRY_PORT:-8002}:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_employee
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-employee-net
    profiles:
      - tool-registry
      - all

  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    container_name: ai-employee-memory
    ports:
      - "${MEMORY_PORT:-8003}:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_employee
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-employee-net
    profiles:
      - memory
      - all

  rag:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    container_name: ai-employee-rag
    ports:
      - "${RAG_PORT:-8004}:8004"
    env_file:
      - path: .env
        required: false
      - path: .env-opencode
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_employee
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - EMBEDDING_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - EMBEDDING_TIMEOUT=${EMBEDDING_TIMEOUT:-180}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-64}
      - USAGE_ENABLED=${USAGE_ENABLED:-true}
      - USAGE_PRICING=${USAGE_PRICING:-{}}
      # ── Answer generation (opencode engine) ──
      # Values come from env_file (.env-opencode). Do NOT override here —
      # `environment:` takes precedence over `env_file:` and would clobber
      # RAG_ANSWER_ENABLED / OPENCODE_PASSWORD set in .env-opencode.
      - OPENCODE_BASE_URL=http://host.docker.internal:4096
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-employee-net
    profiles:
      - rag
      - all

  workflow:
    build:
      context: .
      dockerfile: services/workflow/Dockerfile
    container_name: ai-employee-workflow
    ports:
      - "${WORKFLOW_PORT:-8005}:8005"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_employee
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-employee-net
    profiles:
      - workflow
      - all

  speech:
    build:
      context: .
      dockerfile: services/speech/Dockerfile
    container_name: ai-employee-speech
    ports:
      - "${SPEECH_PORT:-8006}:8006"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_employee
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_BASE_URL=${SARVAM_BASE_URL:-https://api.sarvam.ai}
      - SARVAM_STT_MODEL=${SARVAM_STT_MODEL:-saaras:v3}
      - SARVAM_TTS_SPEAKER=${SARVAM_TTS_SPEAKER:-anushka}
      - SARVAM_TTS_LANGUAGE=${SARVAM_TTS_LANGUAGE:-en-IN}
      - SARVAM_TIMEOUT=60.0
      - USAGE_ENABLED=${USAGE_ENABLED:-true}
      - USAGE_PRICING=${USAGE_PRICING:-{}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-employee-net
    profiles:
      - speech
      - all

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ai-employee-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - ai-employee-net
    profiles:
      - all

volumes:
  postgres_data:
  redis_data:

networks:
  ai-employee-net:
    driver: bridge

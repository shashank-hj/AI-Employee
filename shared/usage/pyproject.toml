[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-shared-usage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy",
    "pydantic",
    "structlog",
    "ai-employee-shared-models",
]

[tool.setuptools]
packages = ["shared.usage"]
package-dir = {"shared.usage" = "."}

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-shared-utils"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "structlog",
    "fastapi",
    "pydantic",
]

[tool.setuptools]
packages = ["shared.utils"]
package-dir = {"shared.utils" = "."}

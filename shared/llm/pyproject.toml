[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-shared-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "structlog",
    "pydantic>=2.0",
    "tenacity",
]

[tool.setuptools]
packages = ["shared.llm"]
package-dir = {"shared.llm" = "."}

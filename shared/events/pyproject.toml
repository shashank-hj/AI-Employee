[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-shared-events"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "redis",
    "pydantic",
    "structlog",
]

[tool.setuptools]
packages = ["shared.events"]
package-dir = {"shared.events" = "."}

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-shared-models"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy",
    "pydantic",
]

[tool.setuptools]
packages = ["shared.models"]
package-dir = {"shared.models" = "."}

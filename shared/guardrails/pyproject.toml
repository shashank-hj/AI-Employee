[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-shared-guardrails"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "redis",
    "pydantic",
]

[tool.setuptools]
packages = ["shared.guardrails"]
package-dir = {"shared.guardrails" = "."}

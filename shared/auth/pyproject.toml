[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-shared-auth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pyjwt",
    "pydantic",
]

[tool.setuptools]
packages = ["shared.auth"]
package-dir = {"shared.auth" = "."}

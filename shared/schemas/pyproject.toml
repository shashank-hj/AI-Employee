[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-shared-schemas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "python-multipart",
]

[tool.setuptools]
packages = ["shared.schemas"]
package-dir = {"shared.schemas" = "."}

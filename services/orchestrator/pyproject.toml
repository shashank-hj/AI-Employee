[project]
name = "ai-employee-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "httpx",
    "structlog",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "ai-employee-shared-auth",
    "ai-employee-shared-events",
    "ai-employee-shared-models",
    "ai-employee-shared-llm",
    "ai-employee-shared-utils",
    "ai-employee-shared-usage",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp",
    "redis",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg-binary>=3.3.4",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "dateparser>=1.1.0",
    "icalendar>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "orchestrator",
    "orchestrator.agents",
    "orchestrator.tools",
    "orchestrator.graph",
    "orchestrator.models",
    "orchestrator.planner",
    "orchestrator.routers",
    "orchestrator.schemas",
    "orchestrator.services",
    "orchestrator.context",
    "orchestrator.database",
    "orchestrator.services.calendar",
    "orchestrator.workers",
]
package-dir = { "orchestrator" = "." }

[tool.setuptools.package-data]
"orchestrator" = ["static/*"]

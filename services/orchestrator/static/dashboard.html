<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HITL Dashboard — AI Employee Platform</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d2991d;--muted:#8b949e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:2rem;max-width:1200px;margin:0 auto}
h1{color:#fff;margin-bottom:1rem;font-size:1.5rem}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.badge{padding:4px 12px;border-radius:12px;font-size:.8rem;font-weight:600}
.badge-pending{background:#1a2332;color:var(--accent)}
.badge-progress{background:#2a1f1a;color:var(--orange)}
.badge-resolved{background:#1a2a1a;color:var(--green)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:.75rem}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.card-header h3{font-size:1rem;color:#fff}
.card-meta{font-size:.8rem;color:var(--muted);margin-bottom:.5rem}
.card-meta span{margin-right:1rem}
.card-body{font-size:.9rem;color:var(--text);margin-bottom:.75rem;line-height:1.5;white-space:pre-wrap;max-height:120px;overflow-y:auto}
.card-actions{display:flex;gap:.5rem}
.btn{padding:6px 16px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-size:.85rem;transition:.2s}
.btn-claim{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-claim:hover{opacity:.85}
.btn-resolve{background:var(--green);color:#fff;border-color:var(--green)}
.btn-resolve:hover{opacity:.85}
.btn-claim:disabled,.btn-resolve:disabled{opacity:.3;cursor:not-allowed}
.empty{text-align:center;padding:3rem;color:var(--muted)}
.refresh{text-align:right;margin-bottom:1rem}
.refresh button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.8rem}
.refresh button:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="header">
  <h1>HITL Dashboard</h1>
  <span class="badge badge-pending" id="count-badge">0 pending</span>
</div>
<div class="refresh">
  <button onclick="loadTasks()">Refresh</button>
</div>
<div id="task-list"><div class="empty">Loading tasks...</div></div>
<script>
const API = '/api/human-tasks';

async function loadTasks() {
  try {
    const [tasksRes, countRes] = await Promise.all([
      fetch(API), fetch(API + '/count')
    ]);
    const tasks = await tasksRes.json();
    const { pending } = await countRes.json();
    document.getElementById('count-badge').textContent = pending + ' pending';
    renderTasks(tasks);
  } catch (e) {
    document.getElementById('task-list').innerHTML = '<div class="empty">Error loading tasks</div>';
  }
}

function renderTasks(tasks) {
  if (!tasks.length) {
    document.getElementById('task-list').innerHTML = '<div class="empty">No pending tasks</div>';
    return;
  }
  document.getElementById('task-list').innerHTML = tasks.map(t => `
    <div class="card" id="task-${t.id}">
      <div class="card-header">
        <h3>${escapeHtml(t.intent.toUpperCase())} — ${escapeHtml(t.user_input.substring(0, 60))}${t.user_input.length > 60 ? '...' : ''}</h3>
        <span class="badge ${t.status === 'pending' ? 'badge-pending' : 'badge-progress'}">${t.status}</span>
      </div>
      <div class="card-meta">
        <span>ID: ${t.id.substring(0, 8)}</span>
        <span>Priority: ${t.priority}</span>
        <span>Created: ${new Date(t.created_at).toLocaleString()}</span>
      </div>
      <div class="card-body">${escapeHtml(t.reason || 'No reason provided')}</div>
      <div class="card-actions">
        <button class="btn btn-claim" onclick="claimTask('${t.id}')">Claim</button>
        <button class="btn btn-resolve" onclick="resolveTask('${t.id}')">Resolve</button>
      </div>
    </div>
  `).join('');
}

async function claimTask(id) {
  const btn = document.querySelector(`#task-${id} .btn-claim`);
  btn.disabled = true;
  btn.textContent = '...';
  try {
    await fetch(`${API}/${id}/claim`, { method: 'POST' });
    loadTasks();
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Claim';
  }
}

async function resolveTask(id) {
  const btn = document.querySelector(`#task-${id} .btn-resolve`);
  btn.disabled = true;
  btn.textContent = '...';
  try {
    await fetch(`${API}/${id}/resolve`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({resolution_note: 'Resolved by operator', assigned_to: 'operator'})
    });
    loadTasks();
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Resolve';
  }
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

loadTasks();
setInterval(loadTasks, 15000);
</script>
</body>
</html>

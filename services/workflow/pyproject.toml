[project]
name = "ai-employee-workflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "httpx",
    "structlog",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "ai-employee-shared-auth",
    "ai-employee-shared-events",
    "ai-employee-shared-models",
    "ai-employee-shared-utils",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp",
    "redis",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg-binary>=3.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "workflow",
    "workflow.database",
    "workflow.graph",
    "workflow.models",
    "workflow.repositories",
    "workflow.routers",
    "workflow.schemas",
    "workflow.services",
]
package-dir = {"workflow" = "."}

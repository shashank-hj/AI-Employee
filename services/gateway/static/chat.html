<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Employee — Web Chat</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273549;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --user: #2563eb;
    --assistant: #334155;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #chat {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 8px #22c55e;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header p { font-size: 12px; color: var(--muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #7f1d1d; border: 1px solid #b91c1c; }
  .msg .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 2px; }
  .typing::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots {
    0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; }
  }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #082f49;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .welcome {
    align-self: center;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 24px;
  }
  .welcome h2 { color: var(--text); font-size: 18px; margin-bottom: 6px; }
</style>
</head>
<body>
  <div id="chat">
    <header>
      <span class="dot"></span>
      <div>
        <h1>AI Employee</h1>
        <p>Web chat channel &middot; messages routed through the gateway</p>
      </div>
    </header>
    <div id="messages">
      <div class="welcome">
        <h2>Hello! I&rsquo;m your AI Employee.</h2>
        Ask me anything &mdash; product info, order status, pricing, documents, weather and more.
      </div>
    </div>
    <form id="form">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off" autofocus>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
(function () {
  var messagesEl = document.getElementById("messages");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var sessionKey = "ai_employee_session_id";
  var sessionId = localStorage.getItem(sessionKey) || genId();
  localStorage.setItem(sessionKey, sessionId);

  function genId() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    return "sess-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function addMessage(role, text) {
    var wrapper = document.querySelector(".welcome");
    if (wrapper && role !== "user") wrapper.remove();

    var el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    var meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = new Date().toLocaleTimeString();
    el.appendChild(meta);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function typing(on) {
    var existing = document.querySelector(".typing");
    if (on && !existing) {
      var t = document.createElement("div");
      t.className = "typing";
      t.textContent = "AI Employee is typing";
      messagesEl.appendChild(t);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } else if (!on && existing) {
      existing.remove();
    }
  }

  async function send(text) {
    var payload = {
      text: text,
      session_id: sessionId,
      channel: "web",
      sender: { external_id: sessionId },
    };
    try {
      var res = await fetch("/api/channels/web", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        var body = await res.json().catch(function () { return {}; });
        throw new Error(body.detail || body.message || "Request failed (" + res.status + ")");
      }
      var data = await res.json();
      return data.final_response || "(no response)";
    } catch (err) {
      throw err;
    }
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("user", text);
    sendBtn.disabled = true;
    typing(true);
    try {
      var reply = await send(text);
      typing(false);
      addMessage("assistant", reply);
    } catch (err) {
      typing(false);
      addMessage("error", err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
})();
</script>
</body>
</html>

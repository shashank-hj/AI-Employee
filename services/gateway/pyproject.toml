[project]
name = "ai-employee-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "httpx",
    "structlog",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "ai-employee-shared-auth",
    "ai-employee-shared-events",
    "ai-employee-shared-models",
    "ai-employee-shared-utils",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp",
    "redis",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "gateway",
    "gateway.database",
    "gateway.models",
    "gateway.routers",
    "gateway.schemas",
    "gateway.services",
]
package-dir = {"gateway" = "."}

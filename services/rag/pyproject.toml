[project]
name = "ai-employee-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "httpx",
    "structlog",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "ai-employee-shared-auth",
    "ai-employee-shared-events",
    "ai-employee-shared-models",
    "ai-employee-shared-utils",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp",
    "redis",
    "pgvector",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "rag",
    "rag.database",
    "rag.models",
    "rag.repositories",
    "rag.routers",
    "rag.schemas",
    "rag.services",
]
package-dir = {"rag" = "."}

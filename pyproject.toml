[project]
name = "ai-employee-platform"
version = "0.1.0"
description = "AI Employee Platform - A multi-agent orchestration system"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings",
    "redis[hiredis]",
    "httpx",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp",
    "python-dotenv",
    "tenacity",
    "dependency-injector",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[tool.uv.workspace]
members = [
    "services/*",
    "shared/*",
]

[tool.uv.sources]
ai-employee-gateway = { workspace = true }
ai-employee-orchestrator = { workspace = true }
ai-employee-tool-registry = { workspace = true }
ai-employee-memory = { workspace = true }
ai-employee-rag = { workspace = true }
ai-employee-workflow = { workspace = true }
ai-employee-shared-auth = { workspace = true }
ai-employee-shared-events = { workspace = true }
ai-employee-shared-models = { workspace = true }
ai-employee-shared-llm = { workspace = true }
ai-employee-shared-utils = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
